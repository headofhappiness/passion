<title>Hamzas säljmotor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky brand bar + tab rail, single column of cards on a soft paper ground, max 1120px */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#eaeeec; --surface-3:#f7f9f8;
  --fg:#16252a; --fg-soft:#5a6c73; --fg-faint:#8798a0;
  --line:#dbe2e0; --line-strong:#c3cecb;
  --brand:#0d3f45; --brand-2:#14565e; --brand-fg:#eaf4f3;
  --accent:#a96310; --accent-fg:#ffffff; --accent-wash:#fbf0e1;
  --good:#2b7349; --good-wash:#e6f2ea;
  --warn:#9d6a12; --warn-wash:#fbf1e0;
  --crit:#9d3a32; --crit-wash:#f8e9e7;
  --focus:#1a7f8c;
  --s1:#27707c; --s1w:#e2f0f1;
  --s2:#3a6ea8; --s2w:#e4ecf6;
  --s3:#7a54a3; --s3w:#efe8f7;
  --s4:#b1573a; --s4w:#fbe9e3;
  --s5:#a8780f; --s5w:#fbf1dc;
  --s6:#2c7f52; --s6w:#e3f2e9;
  --font-d:"Chivo",ui-sans-serif,system-ui,sans-serif;
  --font-b:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:10px; --r-lg:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#161f21; --surface-2:#1d282a; --surface-3:#131c1e;
  --fg:#e7edeb; --fg-soft:#9dadb1; --fg-faint:#798a8e;
  --line:#283537; --line-strong:#364649;
  --brand:#0a2b2f; --brand-2:#103c42; --brand-fg:#d8e9e7;
  --accent:#e0a04a; --accent-fg:#1a1205; --accent-wash:#2a2015;
  --good:#6cc08d; --good-wash:#16271d;
  --warn:#d8a24a; --warn-wash:#2a2115;
  --crit:#e08a80; --crit-wash:#2b1a18;
  --focus:#4fc3cf;
  --s1:#5bb8c4; --s1w:#142c30;
  --s2:#7aa6dd; --s2w:#17222f;
  --s3:#b795e0; --s3w:#241c33;
  --s4:#e0917a; --s4w:#2e1d18;
  --s5:#dcae4e; --s5w:#2b2314;
  --s6:#6cc08d; --s6w:#14281d;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#161f21; --surface-2:#1d282a; --surface-3:#131c1e;
  --fg:#e7edeb; --fg-soft:#9dadb1; --fg-faint:#798a8e;
  --line:#283537; --line-strong:#364649;
  --brand:#0a2b2f; --brand-2:#103c42; --brand-fg:#d8e9e7;
  --accent:#e0a04a; --accent-fg:#1a1205; --accent-wash:#2a2015;
  --good:#6cc08d; --good-wash:#16271d;
  --warn:#d8a24a; --warn-wash:#2a2115;
  --crit:#e08a80; --crit-wash:#2b1a18;
  --focus:#4fc3cf;
  --s1:#5bb8c4; --s1w:#142c30;
  --s2:#7aa6dd; --s2w:#17222f;
  --s3:#b795e0; --s3w:#241c33;
  --s4:#e0917a; --s4w:#2e1d18;
  --s5:#dcae4e; --s5w:#2b2314;
  --s6:#6cc08d; --s6w:#14281d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-d);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-d);text-wrap:balance;margin:0}
p{margin:0}
.prose{font-family:var(--font-b);font-size:15.5px;line-height:1.6;color:var(--fg-soft);max-width:68ch}
.prose strong{color:var(--fg);font-weight:600}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
textarea{resize:vertical;font-family:var(--font-b)}
.num{font-variant-numeric:tabular-nums}

/* ---------- gate ---------- */
#gate{min-height:100svh;display:grid;place-items:center;padding-block:40px;background:
  radial-gradient(1200px 500px at 50% -10%,var(--brand-2),transparent 70%),var(--bg)}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;max-width:420px;width:100%;box-shadow:0 18px 50px -24px rgba(0,0,0,.35)}
.gate-card h1{font-size:23px;font-weight:900;letter-spacing:-.01em}
.lock{width:38px;height:38px;border-radius:50%;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;font-size:18px;margin-bottom:14px}
.gate-row{display:flex;gap:8px;margin-top:16px}
.gate-row input{flex:1;min-width:0}
#gate-err{color:var(--crit);font-size:13px;margin-top:10px}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-fg)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:nowrap}
.mark{font-weight:900;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark span.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.topbar .meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#ffffffb0;flex:none}
.chip-live{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff33;border-radius:999px;padding:3px 9px}
.chip-live i{width:7px;height:7px;border-radius:50%;background:var(--good);display:block}
.chip-live.local i{background:var(--warn)}
.tabs{background:var(--brand-2);position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:19}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#ffffffa8;padding:11px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:#fff;border-bottom-color:var(--accent)}
main{padding-block:26px 64px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.stack>*+*{margin-top:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint)}
.card h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.card h3{font-size:15px;font-weight:700}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hd .eyebrow{margin-left:auto}
.grid{display:grid;gap:16px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.grid>*{min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--fg-faint)}
.btn-pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-pri:hover{filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:var(--surface-2)}
.btn-sm{padding:5px 9px;font-size:12.5px}
.btn-link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- hero quote ---------- */
.creed{background:var(--brand);color:var(--brand-fg);border-radius:var(--r-lg);padding:22px}
.creed::before{content:"";display:block;height:5px;border-radius:3px;margin-bottom:16px;max-width:260px;
  background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6))}
.creed p{font-family:var(--font-b);font-size:18px;line-height:1.45;max-width:46ch}
.creed .by{font-size:11.5px;color:#ffffff8c;margin-top:10px;font-family:var(--font-d);letter-spacing:.04em;text-transform:uppercase}

/* ---------- stats ---------- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile{background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
.tile .v{font-size:25px;font-weight:900;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--sc,var(--fg))}
.tile .s{font-size:12px;color:var(--fg-soft)}
.tile.hi{--sc:var(--accent);--scw:var(--accent-wash);background:var(--scw);border-color:transparent}

/* ---------- checklist ---------- */
.ck{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck input[type=checkbox]{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--good)}
.ck .t{flex:1;min-width:0;font-family:var(--font-b);font-size:15px;line-height:1.45}
.ck.done .t{color:var(--fg-faint);text-decoration:line-through}
.ck .when{font-size:11.5px;color:var(--fg-faint);font-family:var(--font-d);white-space:nowrap}
.x{border:0;background:none;color:var(--fg-faint);cursor:pointer;padding:2px 5px;font-size:16px;line-height:1;border-radius:5px}
.x:hover{color:var(--crit);background:var(--surface-2)}

/* ---------- editable rows ---------- */
.tedit{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;width:auto;flex:1;min-width:0;font-family:var(--font-b);font-size:15px;line-height:1.45}
.tedit:hover{background:var(--surface-3);border-color:var(--line)}
.tedit:focus{background:var(--surface);border-color:var(--focus)}
.tedit.ttl{font-family:var(--font-d);font-weight:700;font-size:14.5px}
.idea>.tedit{flex:none;width:100%}
.ck.done .tedit{color:var(--fg-faint);text-decoration:line-through}
.tools{display:flex;gap:1px;align-items:center;flex:none}
.mv{border:0;background:none;color:var(--fg-faint);cursor:pointer;padding:2px 4px;font-size:13px;line-height:1;border-radius:5px}
.mv:hover{color:var(--fg);background:var(--surface-2)}
.mv.del:hover{color:var(--crit)}
.addrow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.bhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 13px;background:var(--surface-3);border-bottom:1px solid var(--line)}
.bhead .pr{font-size:12px;color:var(--fg-faint);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--crit-wash);border-radius:7px;padding:3px 7px;font-size:12px;color:var(--crit);font-weight:600}
.block{border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));border-radius:var(--r);overflow:hidden}
.bhead{background:var(--scw,var(--surface-3))}
.block+.block{margin-top:12px}
.block .body{padding:4px 15px 14px}
.gate18{display:inline-block;background:var(--warn-wash);color:var(--warn);border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex:none}

/* ---------- method steps ---------- */
.steps{display:grid;gap:10px;counter-reset:s}
@media(min-width:860px){.steps{grid-template-columns:repeat(6,1fr)}}
.step{background:var(--surface-3);border:1px solid var(--line);border-top:3px solid var(--sc,var(--accent));border-radius:var(--r);padding:12px;position:relative}
.step::before{counter-increment:s;content:counter(s);font-size:13px;font-weight:900;color:var(--sc,var(--accent));display:block;margin-bottom:5px}
.step b{display:block;font-size:13.5px;margin-bottom:3px}
.step small{color:var(--fg-soft);font-size:12.5px;line-height:1.4;display:block;font-family:var(--font-b)}
.step.key{background:var(--scw,var(--accent-wash))}
.c1{--sc:var(--s1);--scw:var(--s1w)}
.c2{--sc:var(--s2);--scw:var(--s2w)}
.c3{--sc:var(--s3);--scw:var(--s3w)}
.c4{--sc:var(--s4);--scw:var(--s4w)}
.c5{--sc:var(--s5);--scw:var(--s5w)}
.c6{--sc:var(--s6);--scw:var(--s6w)}

/* ---------- funnel ---------- */
.fun{display:grid;gap:7px}
.fun-row{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px;font-size:13px}
.fun-row .lbl{color:var(--fg-soft);font-weight:600}
.fun-bar{background:var(--surface-2);border-radius:5px;height:24px;overflow:hidden}
.fun-bar i{display:block;height:100%;background:var(--sc,var(--brand-2));border-radius:5px}
.fun-row .lbl{color:var(--sc,var(--fg-soft))}
.fun-row .n{color:var(--sc,var(--fg))}
.fun-row .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-soft);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.paused td{opacity:.55}
.cell{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;width:100%;font-size:13px}
.cell:hover{background:var(--surface-3);border-color:var(--line)}
.cell:focus{background:var(--surface);border-color:var(--focus)}
.due{color:var(--crit);font-weight:700}
.thin{font-size:11.5px;color:var(--fg-faint)}

/* ---------- idea cards ---------- */
.ideas{display:grid;gap:14px}
@media(min-width:720px){.ideas{grid-template-columns:1fr 1fr}}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px}
.idea .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.idea h4{font-size:15px;font-weight:700}
.idea .why{font-family:var(--font-b);font-size:14px;color:var(--fg-soft);line-height:1.5}
.idea .first{background:var(--surface-3);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:9px 11px;font-size:13.5px;font-family:var(--font-b)}
.idea .foot{display:flex;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap}
.idea .time{font-size:12px;color:var(--fg-faint);font-weight:600}
.prio{display:inline-block;border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.prio.nu{background:var(--good-wash);color:var(--good)}
.prio.sen{background:var(--surface-2);color:var(--fg-soft)}
.prio.pr{background:var(--accent-wash);color:var(--accent)}

/* ---------- age grid ---------- */
.agegrid{display:grid;gap:14px;margin-top:16px}
@media(min-width:880px){.agegrid{grid-template-columns:repeat(3,1fr)}}
.agecol{border:1px solid var(--line);border-top-width:3px;border-radius:var(--r);padding:15px;background:var(--surface-3);min-width:0}
.agecol.now{border-top-color:var(--good)}
.agecol.cond{border-top-color:var(--warn)}
.agecol.later{border-top-color:var(--fg-faint)}
.agecol h4{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.agecol h4 .pr{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--fg-faint);font-variant-numeric:tabular-nums}
.agechk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;cursor:pointer;font-family:var(--font-b);font-size:14px;line-height:1.5;color:var(--fg-soft)}
.agechk+.agechk{border-top:1px solid var(--line)}
.agechk input{width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--good)}
.agechk span{min-width:0}
.agechk b{color:var(--fg);font-weight:600}
.agechk.done span{color:var(--fg-faint);text-decoration:line-through}
.agechk.done b{color:var(--fg-faint)}

/* ---------- misc ---------- */
.note{background:var(--surface-3);border:1px solid var(--line);border-left:3px solid var(--fg-faint);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;font-family:var(--font-b);font-size:14px;color:var(--fg-soft);line-height:1.55}
.note.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.note.good{border-left-color:var(--good);background:var(--good-wash)}
.empty{text-align:center;padding:28px 16px;color:var(--fg-soft);font-family:var(--font-b)}
.empty b{display:block;font-family:var(--font-d);color:var(--fg);font-size:15px;margin-bottom:5px}
.fieldset{display:grid;gap:11px}
.f{display:grid;gap:4px}
.f label{font-size:12px;font-weight:700;color:var(--fg-soft)}
.f .hint{font-size:11.5px;color:var(--fg-faint);font-weight:400}
.ab{background:var(--brand);color:var(--brand-fg);border-radius:var(--r-lg);padding:20px}
.ab h2{font-size:18px;font-weight:800;color:var(--brand-fg)}
.ab .prose{color:#ffffffbe}
.ab .prose strong{color:#fff}
svg.chart{width:100%;height:auto;display:block}
.srcs{font-size:12.5px;color:var(--fg-faint);margin-top:12px;line-height:1.6}
.srcs a{color:var(--accent)}
.small{font-size:12.5px;color:var(--fg-faint)}
details.block>summary{padding:13px 15px;background:var(--surface-3);cursor:pointer;display:flex;gap:11px;align-items:center;font-weight:700;font-size:14.5px;list-style:none}
details.block>summary::-webkit-details-marker{display:none}
details.block[open]>summary{border-bottom:1px solid var(--line)}
@media(max-width:760px){
  input,select,textarea{font-size:16px}
  .tedit,.cell{font-size:16px}
  .mv{padding:7px 9px;font-size:15px}
  .x{padding:6px 9px;font-size:18px}
  .btn-sm{padding:7px 11px}
  .ck input[type=checkbox],.agechk input{width:22px;height:22px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
  .fun-row{grid-template-columns:96px 1fr 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section id="gate">
  <div class="gate-card">
    <div class="lock" aria-hidden="true">&#9679;</div>
    <h1>Hamzas säljmotor</h1>
    <p class="prose" style="margin-top:8px">Ditt eget arbetsverktyg. Skriv lösenordet för att öppna.</p>
    <div class="gate-row">
      <input id="gate-pw" type="password" placeholder="Lösenord" autocomplete="current-password" aria-label="Lösenord">
      <button class="btn btn-pri" id="gate-go" type="button">Öppna</button>
    </div>
    <p id="gate-err" hidden>Fel lösenord. Försök igen.</p>
    <p class="small" style="margin-top:18px;line-height:1.5">Lösenordet håller nyfikna ögon borta om du lämnar en flik öppen. Det är inte ett riktigt skydd — det som styr vem som kommer åt sidan är vem länken har delats med.</p>
  </div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="wrap">
      <div class="mark"><span class="dot"></span>Hamzas säljmotor</div>
      <div class="meta">
        <span class="chip-live" id="storemode" title="Var dina uppgifter sparas"><i></i><span id="storemode-t">sparar…</span></span>
      </div>
    </div>
  </header>
  <nav class="tabs" aria-label="Delar"><div class="wrap" id="tabs"></div></nav>
  <main class="wrap"><div id="view"></div></main>
</div>

<script>
"use strict";
const PASSWORD = "kvarten";

const STAGES = ["Prospekt","Personligt mejl","Samtal bokat","Behov kartlagt","Offert","Kund"];
const STATES = ["Aktiv","Pausad","Inte aktuell"];
const KPI = [
  {k:"prospects", t:"Nya prospekt"},
  {k:"mails",     t:"Personliga mejl"},
  {k:"replies",   t:"Positiva svar"},
  {k:"calls",     t:"Bokade samtal"},
  {k:"offers",    t:"Offerter"},

function seed(){
  if(!Array.isArray(S.plan) || !S.plan.length){
    S.plan = PLAN_SEED.map(b=>({id:b.id, wk:b.wk, title:b.title,
      tasks:b.tasks.map(([id,text,gate])=>({id, text, done:!!S.checks[id], gate:!!gate}))}));
  }
  if(!Array.isArray(S.challenge)) S.challenge=[];
  if(!Array.isArray(S.ideas)) S.ideas=[];
  if(!Array.isArray(S.hidden)) S.hidden=[];
  if(!Array.isArray(S.mig)) S.mig=[];
  // gamla tidsindelade planen byts mot de tre spåren, men bara om den aldrig använts
  if(!S.mig.includes("spar")){
    const old=S.plan.some(b=>/^b\d$/.test(b.id));
    const touched=S.plan.some(b=>b.tasks.some(t=>t.done||!/^b\dt\d$/.test(t.id)));
    if(old && !touched){
      S.plan = PLAN_SEED.map(b=>({id:b.id, wk:b.wk, title:b.title,
        tasks:b.tasks.map(([id,text,gate])=>({id, text, done:false, gate:!!gate}))}));
    }
    S.mig.push("spar");
  }
  // de forsta 30 dagarna blir forsta blocket i planen, sa att allt ar en lista
  if(!S.mig.includes("merge30")){
    const src = (S.challenge&&S.challenge.length) ? S.challenge
      : CHALLENGE_SEED.map(([id,text])=>({id,text,done:false}));
    if(src.length && !S.plan.some(b=>b.id==="t0")){
      S.plan.unshift({id:"t0", wk:"Start", title:"Första 30 dagarna",
        tasks:src.map(c=>({id:c.id, text:c.text, done:!!c.done, gate:false}))});
    }
    S.challenge=[];
    S.mig.push("merge30");
  }
  S.prospects.forEach(p=>{ if(!p.state) p.state="Aktiv"; if(p.last==null) p.last=""; if(p.offer==null) p.offer=""; });
}
function planWeek(){
  if(!S.started) return null;
  const s=new Date(S.started+"T00:00:00"); if(isNaN(s)) return null;
  const n=Math.floor((new Date(todayISO()+"T00:00:00")-s)/(7*86400000))+1;
  return Math.max(1,Math.min(12,n));
}

const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
function nf(n){ return (Math.round(n)||0).toLocaleString("sv-SE"); }
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+"-v"+String(Math.ceil(((t-y0)/86400000+1)/7)).padStart(2,"0");
}
const thisWeek=()=>isoWeek(new Date());
function weekList(){ const out=[]; const d=new Date();
  for(let i=7;i>=0;i--){ const x=new Date(d); x.setDate(x.getDate()-i*7); out.push(isoWeek(x)); } return out; }
function daysTo(iso){ if(!iso) return null; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null;
  return Math.round((d-new Date(todayISO()+"T00:00:00"))/86400000); }
const active=()=>S.prospects.filter(p=>p.state==="Aktiv");
function nextPlanTasks(n){
  const out=[];
  for(const b of S.plan){ for(const t of b.tasks){ if(!t.done && t.text.trim()){ out.push({b,t}); if(out.length>=n) return out; } } }
  return out;
}

/* ============== view: resultat ============== */
function segTable(key,label){
  const by={};
  S.prospects.forEach(p=>{
    const k=((p[key]||"").trim())||"Utan "+label;
    by[k]=by[k]||{n:0,mailed:0,calls:0,cust:0};
    by[k].n++; if(p.stage>=1) by[k].mailed++; if(p.stage>=2) by[k].calls++; if(p.stage===5) by[k].cust++;
  });
  const rows=Object.entries(by).sort((a,b)=>b[1].cust-a[1].cust||b[1].n-a[1].n);
  if(!rows.length) return "";
  return `<div class="tw"><table style="min-width:620px"><thead><tr>
    <th>${esc(label[0].toUpperCase()+label.slice(1))}</th><th class="num">Prospekt</th><th class="num">Mejlade</th>
    <th class="num">Samtal</th><th class="num">Kunder</th><th class="num">Mejl → kund</th>
  </tr></thead><tbody>
    ${rows.map(([name,v])=>`<tr>
      <td><b>${esc(name)}</b></td>
      <td class="num">${v.n}</td><td class="num">${v.mailed}</td><td class="num">${v.calls}</td><td class="num">${v.cust}</td>
      <td class="num">${v.mailed>=10? `<b>${(v.cust/v.mailed*100).toFixed(0)} %</b>` : `<span class="thin">för få än</span>`}</td>
    </tr>`).join("")}
  </tbody></table></div>`;
}
function renderResults(){

      <p class="prose">Det du berättat så här långt, innan verktyget hunnit mäta något eget. Det är en uppskattning och ska läsas som en sådan — siffrorna ovan är de mätta.</p>

      <p class="prose">Priset är inte vad du får behålla. Intercom kostar löpande, och faktureringstjänsten tar sin del. Fyll i det du vet — tomma fält räknas som noll.</p>

function chart(data){
  const W=720,H=210,PL=34,PR=10,PT=14,PB=34;
  const iw=W-PL-PR, ih=H-PT-PB;
  const keys=["mails","calls","customers"];
  const cols=["var(--brand-2)","var(--accent)","var(--good)"];
  const names=["Mejl","Samtal","Kunder"];
  let max=0; data.forEach(d=>keys.forEach(k=>{max=Math.max(max,Number(d.v[k])||0)}));
  max=Math.max(4,Math.ceil(max*1.15));
  const bw=iw/data.length, gw=bw*0.62/keys.length;
  let g="";
  [0,Math.round(max/2),max].forEach(t=>{const y=PT+ih-(t/max)*ih;
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`
     + `<text x="${PL-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--fg-faint)" font-family="system-ui">${t}</text>`;});
  data.forEach((d,i)=>{
    const x0=PL+i*bw+bw*0.19;
    keys.forEach((k,j)=>{
      const v=Number(d.v[k])||0; const h=(v/max)*ih;
      if(h>0) g+=`<rect x="${(x0+j*gw).toFixed(1)}" y="${(PT+ih-h).toFixed(1)}" width="${(gw*0.82).toFixed(1)}" height="${h.toFixed(1)}" fill="${cols[j]}" rx="2"/>`;
    });
    g+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="9.5" fill="var(--fg-faint)" font-family="system-ui">${d.w.slice(5)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mejl, bokade samtal och nya kunder per vecka">${g}</svg>
  <div class="row" style="margin-top:10px">${names.map((n,j)=>
    `<span class="small" style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:${cols[j]};display:inline-block"></i>${n}</span>`).join("")}</div>`;
}

const findBlock=id=>S.plan.find(b=>b.id===id);

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-toweek],[data-delprio],[data-delp],[data-chmove],[data-chdel],[data-pmove],[data-pdel],[data-pgate],[data-ptoweek],[data-padd],[data-bmove],[data-bask],[data-bdel],[data-cancel],[data-ihide],[data-idel],[data-ishow],[data-itoweek],#addprio,#addprospect,#imp,#expcsv,#expjson,#impjson,#gate-go,#addch,#addblock,#askreset,#doreset,#addidea");

  const D=t.dataset;
  if(D.go!=null){ location.hash=D.go; render(); return; }

  if(D.delp){ S.prospects=S.prospects.filter(p=>p.id!==D.delp); save(); render(); return; }
  if(D.chmove){ const [id,d]=D.chmove.split("|"); const i=S.challenge.findIndex(c=>c.id===id);
    if(i>=0){ move(S.challenge,i,Number(d)); save(); render(); } return; }
  if(D.chdel){ S.challenge=S.challenge.filter(c=>c.id!==D.chdel); save(); render(); return; }
  if(D.pmove){ const [bid,tid,d]=D.pmove.split("|"); const b=findBlock(bid);
    if(b){ const i=b.tasks.findIndex(x=>x.id===tid); if(i>=0){ move(b.tasks,i,Number(d)); save(); render(); } } return; }
  if(D.pdel){ const [bid,tid]=D.pdel.split("|"); const b=findBlock(bid);
    if(b){ b.tasks=b.tasks.filter(x=>x.id!==tid); save(); render(); } return; }
  if(D.pgate){ const [bid,tid]=D.pgate.split("|"); const b=findBlock(bid);
    const x=b&&b.tasks.find(y=>y.id===tid); if(x){ x.gate=!x.gate; save(); render(); } return; }
  if(D.ptoweek){ const [bid,tid]=D.ptoweek.split("|"); const b=findBlock(bid);
    const x=b&&b.tasks.find(y=>y.id===tid); if(x&&x.text.trim()) toWeek(x.text); return; }
  if(D.padd){ const b=findBlock(D.padd);
    if(b){ const id=uid(); b.tasks.push({id,text:"",done:false,gate:false}); save(); render(); focusTask(id); } return; }
  if(D.bmove){ const [bid,d]=D.bmove.split("|"); const i=S.plan.findIndex(b=>b.id===bid);
    if(i>=0){ move(S.plan,i,Number(d)); save(); render(); } return; }
  if(D.bask){ pendingDel="b:"+D.bask; render(); return; }
  if(D.bdel){ S.plan=S.plan.filter(b=>b.id!==D.bdel); pendingDel=null; save(); render(); return; }
  if(D.ihide){ if(!S.hidden.includes(D.ihide)) S.hidden.push(D.ihide); save(); render(); return; }
  if(D.ishow){ S.hidden=[]; save(); render(); return; }
  if(D.idel){ S.ideas=S.ideas.filter(x=>x.id!==D.idel); save(); render(); return; }
  if(D.itoweek){ const x=S.ideas.find(y=>y.id===D.itoweek);
    if(x){ const txt=(x.t||"").trim()+((x.first||"").trim()?": "+x.first.trim():""); if(txt) toWeek(txt); } return; }
  switch(t.id){
    case "gate-go": tryUnlock(); break;
    case "addprio": { const i=$("#newprio"); const v=i.value.trim(); if(!v) return;
      S.prios.push({id:uid(),text:v,done:false}); save(); render(); break; }
    case "addprospect": { const co=$("#np-co").value.trim(); if(!co) return;
      S.prospects.push({id:uid(),company:co,contact:$("#np-ct").value.trim(),industry:$("#np-in").value.trim(),
        offer:"",stage:Number($("#np-st").value)||0,state:"Aktiv",last:todayISO(),
        nextAction:$("#np-na").value.trim(),nextDate:$("#np-nd").value||"",note:""});
      save(); render(); break; }
    case "addch": { const id=uid(); S.challenge.push({id,text:"",wk:"",done:false}); save(); render(); focusTask(id); break; }
    case "addblock": { S.plan.push({id:uid(),wk:"Eget spår",title:"Vad jag vill göra",tasks:[]}); save(); render(); break; }
    case "askreset": pendingDel="reset"; render(); break;
    case "doreset": S.plan=[]; S.challenge=[]; seed(); pendingDel=null; save(); render(); break;
    case "addidea": { const id=uid(); S.ideas.push({id,t:"",why:"",first:"",time:""}); save(); render();
      const n=document.getElementById("ie-"+id); if(n) n.focus(); break; }
    case "imp": $("#impfile").click(); break;
    case "impjson": $("#impjsonf").click(); break;
    case "expcsv": exportCSV(); break;
    case "expjson": offer("saljmotor-backup.json", JSON.stringify(S,null,2)); break;
  }
});

/* ============== csv / json ============== */
function splitCSV(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","||c===";"){ out.push(cur); cur=""; }
    else cur+=c; }
  out.push(cur); return out.map(s=>s.trim());
}
function importCSV(file){
  const r=new FileReader();
  r.onload=()=>{
    const lines=String(r.result).split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return;
    const first=splitCSV(lines[0]).join(" ").toLowerCase();
    const start=/f(ö|o)retag|company/.test(first)?1:0;
    for(let i=start;i<lines.length;i++){
      const c=splitCSV(lines[i]); if(!c[0]) continue;
      const si=STAGES.findIndex(s=>s.toLowerCase()===String(c[3]||"").toLowerCase());
      S.prospects.push({id:uid(),company:c[0],contact:c[1]||"",industry:c[2]||"",offer:"",
        stage:si>=0?si:0,state:"Aktiv",last:"",
        nextAction:c[4]||"",nextDate:/^\d{4}-\d{2}-\d{2}$/.test(c[5]||"")?c[5]:"",note:c[6]||""});
    }
    save(); render();
  };
  r.readAsText(file);
}
async function offer(filename,data){
  try{ const d=await window.claude?.use?.("downloads"); if(d){ await d.save({filename,data}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(data); }catch(e){}
}
function exportCSV(){
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const rows=[["foretag","kontakt","segment","lage","nasta steg","datum","anteckning","status","senaste kontakt","erbjudande"]]
    .concat(S.prospects.map(p=>[p.company,p.contact,p.industry,STAGES[p.stage],p.nextAction,p.nextDate,p.note,p.state,p.last,p.offer]));
  offer("prospekt.csv", rows.map(r=>r.map(q).join(",")).join("\n"));
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(String(r.result));
    S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);
    S.biz=Object.assign({},DEF.biz,o.biz||{}); S.base=Object.assign({},DEF.base,o.base||{});
    seed(); save(); render();
  }catch(e){} };
  r.readAsText(file);
}

/* ============== gate + boot ============== */
function tryUnlock(){
  const v=($("#gate-pw").value||"").trim().toLowerCase();
  if(v===PASSWORD){ try{ sessionStorage.setItem("hamza-unlocked","1"); }catch(e){} open_(); }
  else { $("#gate-err").hidden=false; $("#gate-pw").value=""; $("#gate-pw").focus(); }
}
function open_(){ $("#gate").hidden=true; $("#app").hidden=false; render(); setMode(mode); connect(); }
function boot(){
  const local=lsRead();
  if(local) S=Object.assign(JSON.parse(JSON.stringify(DEF)),local,{
    biz:Object.assign({},DEF.biz,local.biz||{}), base:Object.assign({},DEF.base,local.base||{})});
  if(!S.started) S.started=todayISO();
  seed();
  let un=false; try{ un=sessionStorage.getItem("hamza-unlocked")==="1"; }catch(e){}
  if(un) open_(); else $("#gate-pw").focus();
}
let connected=false;
async function connect(){
  if(connected) return; connected=true;
  let timer=setTimeout(()=>setMode("local"),10000);
  try{
    const d=await window.claude?.use?.("db");
    clearTimeout(timer);
    if(!d){ setMode("local"); return; }
    db=d;
    const snap=await db.doc("state/all").get();
    const v=snap && (snap.data ? (typeof snap.data==="function"? snap.data(): snap.data) : null);
    if(v && typeof v==="object"){
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),v,{
        biz:Object.assign({},DEF.biz,v.biz||{}), base:Object.assign({},DEF.base,v.base||{})});
      if(!S.started) S.started=todayISO();
      seed(); lsWrite(); render();
    } else { await save(); }
    setMode("db");
  }catch(e){ clearTimeout(timer); setMode("local"); }
}
boot();
</script>
